# MacroShock full stack: Redis + Flask API + Streamlit dashboard.
# Run:  docker-compose up --build
# Dashboard: http://localhost:8501   API: http://localhost:5050   React: http://localhost:5173

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible object store for run artifacts. Stands in for the Ceph/S3 endpoint a real
  # deployment would use; the application code is identical against either.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z   # pinned: :latest drifts silently
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: macroshock
      MINIO_ROOT_PASSWORD: macroshock123
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # web console
    volumes:
      - macroshock-artifacts:/data

  api:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      MACROSHOCK_DB: /app/dbdata/macroshock.db
      # Data source seeded at container start: synthetic (default) | yahoo | csv.
      MACROSHOCK_SOURCE: ${MACROSHOCK_SOURCE:-synthetic}
      MACROSHOCK_START: ${MACROSHOCK_START:-2012-01-01}
      MACROSHOCK_S3_ENDPOINT: http://minio:9000
      MACROSHOCK_S3_ACCESS_KEY: macroshock
      MACROSHOCK_S3_SECRET_KEY: macroshock123
      MACROSHOCK_S3_BUCKET: macroshock
      # Uncomment to require an API key on write endpoints:
      # MACROSHOCK_API_KEY: ${MACROSHOCK_API_KEY:-}
    ports:
      - "5050:5000"                    # host 5050 -> container 5000 (5000 clashes with macOS AirPlay / .NET)
    volumes:
      - macroshock-data:/app/dbdata    # DB-only volume (NOT over /app/data code) — survives restarts
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # Celery worker: executes submitted workflows off the request path.
  worker:
    build: ./backend
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      MACROSHOCK_DB: /app/dbdata/macroshock.db
      MACROSHOCK_SOURCE: ${MACROSHOCK_SOURCE:-synthetic}
      MACROSHOCK_S3_ENDPOINT: http://minio:9000
      MACROSHOCK_S3_ACCESS_KEY: macroshock
      MACROSHOCK_S3_SECRET_KEY: macroshock123
      MACROSHOCK_S3_BUCKET: macroshock
    volumes:
      - macroshock-data:/app/dbdata
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  dashboard:
    # Self-contained: runs the analytics engine in-process (no API dependency). Built from the
    # repo root so the image can include the backend package (see frontend/Dockerfile).
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"

  # Optional React/TypeScript client (served by nginx). The browser calls the API on
  # localhost:5050, so the API's CORS must allow http://localhost:5173 (it does by default).
  react:
    build:
      context: ./frontend-react
      args:
        VITE_API_BASE: http://localhost:5050
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  macroshock-data:
  macroshock-artifacts:
