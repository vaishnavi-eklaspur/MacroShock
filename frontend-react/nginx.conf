# Serves the built SPA. Listens on 8080 because the image runs unprivileged (non-root cannot
# bind ports below 1024), and falls back to index.html so client-side routes resolve.
server {
    listen 8080;
    server_name _;

    # Don't advertise the nginx version to clients.
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
