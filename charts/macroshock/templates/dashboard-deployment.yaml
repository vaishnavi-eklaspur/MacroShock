{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "macroshock.fullname" . }}-{{ .Values.dashboard.name }}
  labels:
    {{- include "macroshock.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.dashboard.name }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "macroshock.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.dashboard.name }}
  template:
    metadata:
      labels:
        {{- include "macroshock.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.dashboard.name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.dashboard.name }}
          image: {{ include "macroshock.image" (dict "root" $ "name" .Values.dashboard.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.containerPort }}
              protocol: TCP
          {{- with .Values.dashboard.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          # The dashboard builds the covariance/regime model in-process on first start.
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
