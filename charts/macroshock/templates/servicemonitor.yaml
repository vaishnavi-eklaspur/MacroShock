{{- if and .Values.api.enabled .Values.metrics.serviceMonitor.enabled -}}
{{/* Requires the Prometheus Operator CRDs. Scrapes the API's prometheus_client /metrics. */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "macroshock.fullname" . }}-{{ .Values.api.name }}
  labels:
    {{- include "macroshock.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.api.name }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "macroshock.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.api.name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
