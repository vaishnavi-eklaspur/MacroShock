{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "macroshock.fullname" . }}-{{ .Values.api.name }}
  labels:
    {{- include "macroshock.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.api.name }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "macroshock.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.api.name }}
  template:
    metadata:
      labels:
        {{- include "macroshock.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.api.name }}
      {{- if .Values.metrics.podAnnotations }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.api.containerPort | quote }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.api.name }}
          image: {{ include "macroshock.image" (dict "root" $ "name" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.api.apiKeySecret.enabled }}
            - name: MACROSHOCK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.apiKeySecret.secretName | required "api.apiKeySecret.secretName is required when apiKeySecret.enabled=true" }}
                  key: {{ .Values.api.apiKeySecret.secretKey }}
            {{- end }}
          # The API seeds its store on start, so give it room before liveness bites.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
