# Digest-pinned base images are reproducible but do NOT pick up security patches on rebuild.
# Dependabot bumps the pins (and the language dependencies) so reproducibility doesn't turn
# into silent rot -- each bump arrives as a PR that must pass the full CI pipeline.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/frontend-react"]
    schedule: { interval: weekly }

  - package-ecosystem: pip
    directory: "/backend"
    schedule: { interval: weekly }

  - package-ecosystem: npm
    directory: "/frontend-react"
    schedule: { interval: weekly }

  - package-ecosystem: gomod
    directory: "/cli"
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
