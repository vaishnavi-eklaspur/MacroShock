name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Independent formula verification (stdlib only)
        run: python scripts/verify_math.py

  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]   # 3.11 = the Docker/deploy runtime; 3.12 guards drift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check . --select E9,F63,F7,F82
      - name: Seed database
        working-directory: backend
        run: python -m data.seed
      - name: Run tests with coverage
        working-directory: backend
        run: pytest -q --cov=analytics --cov=data --cov=app --cov-report=term-missing --cov-fail-under=75

  frontend-react:
    # The React/TS client had no CI - a type error could land on main unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and type-check + build (tsc runs in the build script)
        working-directory: frontend-react
        run: |
          npm ci
          npm run build

  security-audit:
    # Dependency vulnerability scanning. npm production deps are gated hard (they ship to the
    # browser); pip-audit is advisory (non-blocking) so a future transitive CVE in an
    # unmaintained snapshot doesn't turn the badge red, while the scan output stays visible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (backend dependencies)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --desc
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (shipped production deps — gated at high)
        working-directory: frontend-react
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  helm-chart:
    # The Helm chart is a deliverable: lint it, render every feature path, and validate the
    # rendered manifests against real Kubernetes schemas so a broken chart can't reach main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint
        run: helm lint charts/macroshock
      - name: Render manifests (defaults + all optional features)
        run: |
          helm template macroshock charts/macroshock > /dev/null
          helm template macroshock charts/macroshock \
            --set metrics.serviceMonitor.enabled=true \
            --set ingress.enabled=true \
            --set api.apiKeySecret.enabled=true \
            --set api.apiKeySecret.secretName=macroshock-api-key > rendered.yaml
      - name: Validate rendered manifests (kubeconform)
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          ./kubeconform -summary -strict -ignore-missing-schemas rendered.yaml

  docker-smoke:
    # Builds and boots the FULL stack and checks it actually serves - catches things unit
    # tests can't (e.g. a volume mount that shadows the code, a broken Dockerfile).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build api dashboard redis
      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5050/health; then echo; echo "API healthy"; exit 0; fi
            sleep 3
          done
          echo "API never became healthy"; docker compose logs api; exit 1
      - name: Check the dashboard responds
        run: |
          curl -sf http://localhost:8501/_stcore/health \
            || { docker compose logs dashboard; exit 1; }
      - name: Tear down
        if: always()
        run: docker compose down -v
