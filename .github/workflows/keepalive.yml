name: keep-alive

# Keeps the free-tier Streamlit deployment warm so a recruiter never lands on a sleep screen.
#
# The demo now runs entirely on Streamlit Community Cloud (the dashboard drives the analytics
# engine in-process — no separate API host). Streamlit counts only real browser sessions
# (websocket), so a plain curl does NOT register as a visit: a headless Chromium visit does,
# and it also clicks the "get this app back up" button if the app has fallen asleep.
on:
  schedule:
    - cron: "23 */2 * * *"      # real browser visit — must land inside the idle window.
                                # Every 2h (not 4h): Streamlit's idle window can be shorter
                                # than 4h, and a cold container costs a visitor ~30-60s.
  workflow_dispatch: {}

# Least privilege for the GITHUB_TOKEN -- read-only: this job only visits a public URL.
permissions:
  contents: read

jobs:
  browser-visit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + headless Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Visit the Streamlit app (opens a websocket; wakes it if asleep)
        run: |
          cat > visit.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          await page.goto('https://macroshock.streamlit.app/', { waitUntil: 'load', timeout: 120000 });
          // If it fell asleep, click the wake button.
          const wake = page.getByText(/get this app back up/i);
          if (await wake.count() > 0) {
            console.log('App was asleep — clicking wake button.');
            await wake.first().click();
          }
          // Hold the session open so the websocket registers as a real visit.
          await page.waitForTimeout(90000);
          console.log('Visit complete:', await page.title());
          await browser.close();
          EOF
          node visit.mjs
